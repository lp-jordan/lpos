# Litestream: continuous backup of every LPOS SQLite database to R2
# (restore any DB to any point in time). Runs as the macOS login agent
# ~/Library/LaunchAgents/com.leaderpass.lpos-litestream.plist via
# `doppler run`, which supplies the R2_BACKUP_* and CLOUDFLARE_ACCOUNT_ID values.
#
# Restore (LPOS stopped), e.g. the activity log as of 13:32 ET on Sep 28:
#   doppler run -- litestream restore -config ops/litestream.yml \
#     -timestamp 2026-09-28T17:32:00Z -o /tmp/restored.sqlite \
#     /Users/lpos/lp-app-ecosystem/lpos-dashboard/data/lpos-activity.sqlite
#
# A NEW data/*.sqlite file must be added here to be protected (the nightly
# BackupService still covers every file regardless).
dbs:
  - path: /Users/lpos/lp-app-ecosystem/lpos-dashboard/data/lpos-core.sqlite
    replica:
      type: s3
      bucket: ${R2_BACKUP_BUCKET}
      path: litestream/lpos-core
      endpoint: https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com
      region: auto
      access-key-id: ${R2_BACKUP_ACCESS_KEY_ID}
      secret-access-key: ${R2_BACKUP_SECRET_ACCESS_KEY}
  - path: /Users/lpos/lp-app-ecosystem/lpos-dashboard/data/lpos-activity.sqlite
    replica:
      type: s3
      bucket: ${R2_BACKUP_BUCKET}
